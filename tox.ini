[tox]
requires=
    tox>=4.22
    virtualenv>=20.7.2
skip_missing_interpreters=True
envlist =
    pep8,black,mypy,
    gevent,eventlet,sasl,
    docs,
    pypy3
isolated_build = true

[testenv]
wheel = True
wheel_build_env = build
install_command = pip install {opts} {packages}
passenv =
    CI
    TOX_*
    CI_*
    ZOOKEEPER_*
setenv =
    pypy3: PYPY=1
dependency_groups =
    test
extras =
    gevent: gevent
    eventlet: eventlet
    sasl: sasl
deps =
    sasl: kerberos
allowlist_externals =
    {toxinidir}/ensure-zookeeper-env.sh
    {toxinidir}/init_krb5.sh
    bash
commands =
        bash \
    sasl: {toxinidir}/init_krb5.sh {envtmpdir}/kerberos \
        {toxinidir}/ensure-zookeeper-env.sh \
        pytest {posargs: -ra -v --cov-report=xml --cov=kazoo kazoo/tests}

[testenv:build]

[testenv:docs]
dependency_groups =
    test-extras
extras =
    eventlet
    gevent
    sasl
deps =
    -r{toxinidir}/docs/requirements.txt
commands = sphinx-build -b html docs {toxworkdir}/docs/html

[testenv:pep8]
dependency_groups = pep8
usedevelop = True
commands = flake8 {posargs} {toxinidir}/kazoo

[testenv:black]
dependency_groups = black
usedevelop = True
commands = black --check {posargs: {toxinidir}/kazoo}

[testenv:mypy]
dependency_groups = mypy
extras =
    eventlet
    gevent
    sasl
usedevelop = True
commands = mypy --config-file {toxinidir}/pyproject.toml {toxinidir}/kazoo
