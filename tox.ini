[tox]
requires=
    tox>=4.22
    virtualenv>=20.7.2
skip_missing_interpreters=True
envlist =
    ruff,mypy,
    gevent,eventlet,sasl,
    docs,
    pypy3
isolated_build = true

[testenv]
wheel = True
wheel_build_env = build
install_command = pip install {opts} {packages}
passenv =
    ZOOKEEPER_*
    RUFF_*
setenv =
    pypy3: PYPY=1
dependency_groups =
    test
extras =
    gevent: gevent
    eventlet: eventlet
    sasl: sasl
deps =
    sasl: kerberos
allowlist_externals =
    {toxinidir}/ensure-zookeeper-env.sh
    {toxinidir}/init_krb5.sh
    bash
    echo
commands =
        echo Current environment: {env:TOX_ENV_NAME}
        bash \
    sasl: {toxinidir}/init_krb5.sh {envtmpdir}/kerberos \
        {toxinidir}/ensure-zookeeper-env.sh \
        pytest {posargs: -ra -v --cov-append --cov-report=xml --cov=kazoo kazoo/tests}

[testenv:build]

[testenv:clean_coverage]
dependency_groups =
    coverage
skip_install = true
commands = coverage erase

[testenv:docs]
dependency_groups =
    test-extras
extras =
    eventlet
    gevent
    sasl
deps =
    -r{toxinidir}/docs/requirements.txt
commands = sphinx-build -b html docs {toxworkdir}/docs/html

[testenv:ruff]
dependency_groups = ruff
usedevelop = True
commands =
    ruff check {posargs: {toxinidir}/kazoo}
    ruff format --check {posargs: {toxinidir}/kazoo}

[testenv:mypy]
dependency_groups = mypy
extras =
    eventlet
    gevent
    sasl
usedevelop = True
commands = mypy --config-file {toxinidir}/pyproject.toml {toxinidir}/kazoo
