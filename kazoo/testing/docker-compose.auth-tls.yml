# Authentication overlay: tls
#
# Enables TLS client authentication via the official image's public
# interface:
#   * ZOO_CFG_EXTRA -> secureClientPort + NettyServerCnxnFactory + ssl.*
#     properties + X509AuthenticationProvider
#   * certgen sidecar -> throwaway PKI into ${KAZOO_TESTING_ZK_WORK_DIR}/certs
#   * keystore/truststore bind-mounted at /conf/keystore.p12,
#     /conf/truststore.p12 (generated by the certgen sidecar)
#
# The servers listen on secureClientPort 2281 (published as an ephemeral
# host port via `0:2281`) and require client certificates (ssl.clientAuth=need).
# Clients connect with use_ssl=True + certfile/keyfile/ca from
# ${KAZOO_TESTING_ZK_WORK_DIR}/certs.
#
# Under the network-holder split (docker-compose.base.yml header), the secure
# port 2281 is published on the *holder* services (zoo1/zoo2/zoo3 — the netns
# owners carry `ports:`), while the TLS configuration itself (ZOO_CFG_EXTRA,
# keystore/truststore mounts, certgen dependency) lives on the *process*
# services (zoo1-service/zoo2-service/zoo3-service).
#
# NOTE: never set SERVER_JVMFLAGS here — compose merges environment maps
# wholesale per key and would silently override the base interpolation.
# The plain 2181 port stays enabled (base file) and is used by the base
# healthcheck only; tests always talk to the secure port.

x-tls-environment: &tls_environment
  ZOO_CFG_EXTRA: |
    secureClientPort=2281
    serverCnxnFactory=org.apache.zookeeper.server.NettyServerCnxnFactory
    ssl.keyStore.location=/conf/keystore.p12
    ssl.keyStore.password=changeit
    ssl.trustStore.location=/conf/truststore.p12
    ssl.trustStore.password=changeit
    ssl.clientAuth=need
    authProvider.1=X509AuthenticationProvider
    ${KAZOO_TESTING_ZK_CFG_EXTRA:-}

services:
  certgen:
    build: ./dockerfiles/certgen
    environment:
      CERTS_DIR: /certs
    volumes:
      - ${KAZOO_TESTING_ZK_WORK_DIR}/certs:/certs
    healthcheck:
      test: ["CMD-SHELL", "test -f /certs/.ready"]
      interval: 2s
      timeout: 2s
      retries: 60

  zoo1:
    # Holder: publishes the secure client port (netns owner carries ports).
    ports:
      - 2281

  zoo1-service:
    depends_on:
      certgen:
        condition: service_healthy
    environment:
      <<: *tls_environment
    volumes:
      - ${KAZOO_TESTING_ZK_WORK_DIR}/certs/server/keystore.p12:/conf/keystore.p12:ro
      - ${KAZOO_TESTING_ZK_WORK_DIR}/certs/server/truststore.p12:/conf/truststore.p12:ro

  zoo2:
    ports:
      - 2281

  zoo2-service:
    depends_on:
      certgen:
        condition: service_healthy
    environment:
      <<: *tls_environment
    volumes:
      - ${KAZOO_TESTING_ZK_WORK_DIR}/certs/server/keystore.p12:/conf/keystore.p12:ro
      - ${KAZOO_TESTING_ZK_WORK_DIR}/certs/server/truststore.p12:/conf/truststore.p12:ro

  zoo3:
    ports:
      - 2281

  zoo3-service:
    depends_on:
      certgen:
        condition: service_healthy
    environment:
      <<: *tls_environment
    volumes:
      - ${KAZOO_TESTING_ZK_WORK_DIR}/certs/server/keystore.p12:/conf/keystore.p12:ro
      - ${KAZOO_TESTING_ZK_WORK_DIR}/certs/server/truststore.p12:/conf/truststore.p12:ro
